# El despertador: cada media hora vacia la cola de objetos a borrar. Sin esto, cambiar la foto
# de perfil o borrar un mensaje con imagen deja el archivo viejo ocupando el cupo para siempre.
[triggers]
crons = ["*/30 * * * *"]

# El atajo interno al bucket. Solo lo usa el borrado, que no necesita firmar nada.
[[r2_buckets]]
binding = "ADJUNTOS"
bucket_name = "llamadita-adjuntos"

# Los secretos NO van acá. Se cargan con:
