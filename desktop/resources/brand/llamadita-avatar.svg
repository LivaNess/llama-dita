<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" width="100%" height="100%">
  <defs>
    <style>
      .stroke-dark {
        stroke: #0f172a;
        stroke-width: 14;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .fill-white {
        fill: #ffffff;
      }
      .fill-grey {
        fill: #a8a29e;
      }
      .fill-dark-band {
        fill: #57534e;
      }
      .fill-dark {
        fill: #0f172a;
      }
    </style>
  </defs>

  <!-- VINCHA AURICULARES (FONDO) -->
  <g class="stroke-dark">
    <!-- Banda exterior -->
    <path d="M 125 150 C 115 80, 285 80, 275 150" fill="none" stroke="#0f172a" stroke-width="36" stroke-linecap="round" />
    <!-- Almohadilla interior de la vincha -->
    <path d="M 132 145 C 124 92, 276 92, 268 145" fill="none" stroke="#a8a29e" stroke-width="14" stroke-linecap="round" />
  </g>

  <!-- OREJAS -->
  <!-- Oreja Izquierda -->
  <path d="M 142 165 C 130 110, 140 65, 160 65 C 178 65, 178 115, 175 160" 
        class="fill-white stroke-dark" />
  <path d="M 152 140 C 146 110, 150 88, 160 88 C 168 88, 168 115, 166 140" 
        fill="none" stroke="#0f172a" stroke-width="8" stroke-linecap="round" />

  <!-- Oreja Derecha -->
  <path d="M 258 165 C 270 110, 260 65, 240 65 C 222 65, 222 115, 225 160" 
        class="fill-white stroke-dark" />
  <path d="M 248 140 C 254 110, 250 88, 240 88 C 232 88, 232 115, 234 140" 
        fill="none" stroke="#0f172a" stroke-width="8" stroke-linecap="round" />

  <!-- CUERPO Y CABEZA DE LA LLAMA -->
  <!-- Contorno principal continuo: cabeza, mejillas y cuello -->
  <path d="M 160 145 
           C 180 142, 220 142, 240 145
           C 265 145, 275 180, 270 215
           C 265 245, 285 270, 270 290
           C 255 305, 245 320, 255 390
           L 145 390
           C 155 320, 145 305, 130 290
           C 115 270, 135 245, 130 215
           C 125 180, 135 145, 160 145 Z" 
        class="fill-white stroke-dark" />

  <!-- COPA DEL AURICULAR IZQUIERDO -->
  <g>
    <!-- Almohadilla -->
    <rect x="100" y="180" width="46" height="78" rx="23" 
          class="fill-grey stroke-dark" />
    <!-- Conector de la vincha a la copa -->
    <path d="M 125 152 L 125 185" fill="none" class="stroke-dark" stroke-width="12" />
  </g>

  <!-- COPA DEL AURICULAR DERECHO -->
  <g>
    <!-- Almohadilla -->
    <rect x="254" y="180" width="46" height="78" rx="23" 
          class="fill-grey stroke-dark" />
    <!-- Conector de la vincha a la copa -->
    <path d="M 275 152 L 275 185" fill="none" class="stroke-dark" stroke-width="12" />
  </g>

  <!-- ROSTRO -->
  <!-- Ojo Izquierdo -->
  <ellipse cx="166" cy="232" rx="13" ry="15" class="fill-dark" />
  <circle cx="170" cy="227" r="4.5" fill="#ffffff" />

  <!-- Ojo Derecho -->
  <ellipse cx="234" cy="232" rx="13" ry="15" class="fill-dark" />
  <circle cx="230" cy="227" r="4.5" fill="#ffffff" />

  <!-- HOCICO -->
  <g transform="translate(0, 5)">
    <!-- Forma ovalada del hocico -->
    <path d="M 180 250 C 180 238, 220 238, 220 250 C 228 265, 218 282, 200 282 C 182 282, 172 265, 180 250 Z" 
          class="fill-grey" />
    
    <!-- Nariz (forma redondeada / triangular suave) -->
    <path d="M 191 254 C 193 249, 207 249, 209 254 C 210 258, 203 264, 200 264 C 197 264, 190 258, 191 254 Z" 
          class="fill-dark" />
    
    <!-- Boca sonriente -->
    <path d="M 192 268 Q 200 274 200 263 Q 200 274 208 268" 
          fill="none" stroke="#0f172a" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
